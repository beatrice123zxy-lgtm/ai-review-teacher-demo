function homeView(){return `<div class="view with-dock"><p class="page-overline">${P.teacher}</p><h1 class="page-title">${U.homeTitle}</h1>${filters()}<div class="card overview">${[['completion',U.completion,U.upCompletion],['mastery',U.mastery,U.upMastery]].map(([k,label,foot])=>`<div><p class="metric-label">${label}</p><p class="big-number">${DEMO.overview[k]}<span>%</span></p><div class="meter"><i style="width:${DEMO.overview[k]}%"></i></div><p class="metric-foot">${foot}</p></div>`).join('')}</div>${section(`${U.problems}<span class="section-count">3</span>`,`<span class="micro">${U.errorLabel}</span>`)}<div class="card problem-list">${DEMO.issues.map((x,i)=>`<button class="problem-row" data-action="issue" data-id="${x.id}"><span class="problem-no">0${i+1}</span><span class="problem-copy"><strong>${x.title}</strong><p>${x.short}</p></span><span class="problem-end"><span class="problem-rate">${x.rate}<small>%</small></span>${state.lectureAdopted&&state.lecture.some(item=>item.id===x.id)?`<span class="included-tag">${RU.included}</span>`:''}</span>${icon('chevron')}</button>`).join('')}</div>${section(`${U.attention}<span class="section-count">5</span>`,`<button class="small-link" data-action="tab" data-tab="students">${U.allStudents}${icon('chevron')}</button>`)}<div class="card attention">${DEMO.focus.map(p=>`<button class="student-mini" data-action="student" data-id="${p.id}" aria-label="查看${p.name}详情">${avatar(p)}<span class="name">${p.name}</span>${tagHTML(p)}</button>`).join('')}</div><p class="tip-line">${icon('info')}${U.attentionHint}</p></div>`;}
function renderDock(){const d=$('#dock');d.style.display='block';if(tab==='outline'){d.innerHTML=`<div class="btn-pair"><button class="btn primary" data-action="${projecting?'exit-projection':'project-outline'}">${icon('board')}${projecting?RU.projectExit:RU.project}</button><button class="btn secondary" data-action="outline-home">${RU.home}</button></div><p class="dock-note">${projecting?RU.projectHint:U.aiDisclaimer}</p>`;return;}if(detailId){const status=state.status[detailId];d.innerHTML=`<div class="btn-pair"><button class="btn primary" data-action="adopt-student" ${!adviceReady?'disabled':''}>${icon(status==='adopted'?'check':'spark')}${status==='adopted'?U.adopted:U.adoptAdvice}</button><button class="btn secondary" data-action="defer-student">${status==='deferred'?U.deferred:U.defer}</button></div><p class="dock-note">${U.localOnly}</p>`;}else if(tab==='home'){d.innerHTML=`<button class="btn primary" data-action="generate-lecture">${icon('spark')}${state.lectureAdopted?U.lectureAlready:U.generate}${state.lectureAdopted?icon('chevron'):''}</button><p class="dock-note">${U.aiDisclaimer}</p>`;}else if(tab==='tasks'){d.innerHTML=`<button class="btn primary" data-action="${state.tasksReady?'confirm-tasks':'generate-tasks'}">${icon(state.tasksReady?'check':'spark')}${state.tasksReady?(state.assigned?U.taskSent:U.taskConfirm):U.taskGenerate}</button><p class="dock-note">${U.aiDisclaimer}</p>`;}else{d.style.display='none';}}
function studentView(){const p=people.find(x=>x.id===detailId);const note=state.notes[p.id]||'';return `<div class="view with-dock"><div class="student-header">${avatar(p)}<div><h1>${p.name}</h1><p>${P.className} · ${P.subject} · 掌握度 ${p.mastery}%</p>${tagHTML(p)}</div></div>${section(U.portrait,`<span class="micro">${U.weekRecent}</span>`)}<div class="card profile-card">${[p.surface,p.behavior,p.deep].map((t,i)=>`<div class="profile-level"><span class="profile-dot">${i+1}</span><strong>${U.layers[i]}</strong><p>${t}</p></div>`).join('')}</div><p class="tip-line">${icon('info')}${U.portraitFoot}</p>${section(U.intervention,adviceReady?`<button class="small-link" data-action="edit-advice">${icon('edit')}${adviceEdit?U.saveAdvice:U.editAdvice}</button>`:'')}<div class="card ai-card"><div class="ai-label">${icon('spark')}AI 建议 · ${p.level}</div>${!adviceReady?`<div class="inline-loader">${icon('reset')}${U.loading}</div>`:adviceEdit?`<textarea id="adviceInput" class="text-input" aria-label="修改干预建议" maxlength="500">${esc(state.advice[p.id]||p.advice)}</textarea>`:`<p>${esc(state.advice[p.id]||p.advice)}</p>`}</div><label class="field-label" for="teacherNote">${U.note}<small>${U.notePrivacy}</small></label><textarea id="teacherNote" class="text-input" placeholder="${U.noteHint}" maxlength="500">${esc(note)}</textarea>${state.records[p.id]?`<div class="notice">${icon(state.status[p.id]==='adopted'?'check':'clock')}<span><b>${U.actionRecord}</b><br>${esc(state.records[p.id])}</span></div>`:''}</div>`;}
function studentRows(list){return list.map(p=>`<button class="student-row" data-action="student" data-id="${p.id}">${avatar(p)}<span class="person"><strong>${p.name}</strong><p>${P.className} · ${p.level}</p></span>${tagHTML(p)}${icon('chevron')}</button>`).join('')||`<div class="empty">${U.noStudent}</div>`;}
function filteredPeople(){return people.filter(p=>(rosterFilter===0?p.id<=5:rosterFilter===1?!!state.status[p.id]:true)&&p.name.includes(search.trim()));}
function studentsView(){return `<div class="view"><p class="page-overline">${P.className} · ${P.total} 位学生</p><h1 class="page-title">${U.studentTitle.replace('详情','')}</h1><p class="page-sub">${U.studentSub}</p><div class="search-wrap">${icon('search')}<input id="studentSearch" class="roster-search" placeholder="${U.search}" aria-label="${U.search}" value="${esc(search)}"></div><div class="segmented">${U.filters.map((t,i)=>`<button class="${i===rosterFilter?'active':''}" data-action="roster-filter" data-index="${i}">${t}${i===0?' 5':i===2?' 45':''}</button>`).join('')}</div><div class="card list-card" id="studentRows">${studentRows(filteredPeople())}</div></div>`;}
function tasksView(){return `<div class="view with-dock"><p class="page-overline">分层任务布置 · ${P.className}</p><h1 class="page-title">${U.taskTitle}</h1><p class="page-sub">${U.taskSub}</p>${state.tasksReady?`<div class="notice">${icon('info')}<span>${U.taskNotice}</span></div>${state.groups.map(g=>{const members=people.filter(p=>state.members[p.id-1]===g.id);return `<article class="card group-card"><div class="group-head"><div class="group-title"><span class="group-mark">${g.mark}</span><div><h3>${g.name}</h3><p>${g.description}</p></div></div><span class="group-count">${members.length}<small>人</small></span></div><div class="student-chips">${members.slice(0,4).map(p=>`<button class="student-chip" data-action="move-student" data-id="${p.id}">${p.name}</button>`).join('')}<button class="student-chip" data-action="move-group" data-group="${g.id}" aria-label="查看${g.name}全部学生">+${Math.max(0,members.length-4)}</button></div>${g.questions.map((q,i)=>`<div class="question"><span class="question-no">0${i+1}</span><p>${esc(q.text)}</p><button class="remove" data-action="delete-question" data-group="${g.id}" data-id="${q.id}" aria-label="删除${g.name}第${i+1}题">${icon('trash')}</button></div>`).join('')||`<div class="empty">${U.taskEmpty}<br><button class="small-link" data-action="restore-questions" data-group="${g.id}">${U.taskRestore}</button></div>`}<div class="group-actions"><span>${g.questions.length} 道练习 · ${U.taskSubject}</span><button data-action="move-group" data-group="${g.id}">${icon('move')}${U.taskStudent}</button></div></article>`;}).join('')}<div class="row between" style="margin-top:15px"><span class="micro">${state.assigned?U.taskPosted:U.taskReady}</span><button class="small-link" data-action="regenerate-tasks">${icon('reset')}${U.taskRebuild}</button></div>`:`<div class="card" style="margin-top:22px;padding:32px 18px"><div class="loading-mark">${icon('tasks')}</div><h2 class="success-title" style="font-size:16px">${U.taskPreview}</h2><p class="success-copy">${U.taskPreviewSub}</p><div class="divider"></div>${DEMO.groups.map(g=>`<div class="summary-row"><span>${g.name}</span><span>${g.size} 人 · ${g.questions.length} 道题</span></div>`).join('')}</div><div class="notice">${icon('lock')}<span>${U.taskNotice}</span></div>`}</div>`;}
function boardView(){const d=DEMO.dashboard;return `<div class="view"><p class="page-overline">校方试点看板</p><h1 class="page-title">${U.dashboardTitle}</h1><p class="page-sub">${U.dashboardSub}</p><span class="sample-label">${U.dashboardBadge}</span><div class="dashboard-grid">${[d.adoption,null,d.satisfaction,d.completion].map((v,i)=>`<div class="card dash-metric"><p class="metric-label">${U.dashboardMetrics[i]}</p>${i===1?`<p class="time-value"><del>${d.before}</del><span>→</span><b>${d.after}</b><span>分钟</span></p>`:`<p class="big-number">${v}<span>%</span></p>`}<p class="metric-foot">${U.dashboardNotes[i]}</p></div>`).join('')}</div><div class="card chart-card"><h2 class="section-title">${U.trendTitle}</h2><p class="page-sub" style="font-size:10px">${U.trendSub}</p><div class="chart-legend">${d.series.map(s=>`<span><i class="legend-dot" style="background:${s.stroke}"></i>${s.name}</span>`).join('')}</div>${chartSVG()}<div class="chart-tooltip" id="chartTooltip">${U.chartHint}</div></div><div class="notice">${icon('info')}<span><b>${U.evaluation}</b><br>${U.evaluationText}</span></div>${feedbackLibraryCard()}</div>`;}
function chartSVG(){const d=DEMO.dashboard,xx=i=>35+i*78,yy=v=>150-(v-30)*2.05;return `<svg class="chart" viewBox="0 0 308 188" role="img" aria-label="共性问题错误率趋势：图像平移78%降至62%，待定系数68%降至48%，实际应用59%降至41%">${[30,50,70,90].map(v=>`<path d="M31 ${yy(v)}H284" stroke="#eef1e9" stroke-width="1"/><text x="0" y="${yy(v)+4}">${v}%</text>`).join('')}${d.weeks.map((w,i)=>`<text x="${xx(i)}" y="177" text-anchor="middle">${w}</text>`).join('')}${d.series.map((s,j)=>`<path d="${s.values.map((v,i)=>`${i?'L':'M'}${xx(i)} ${yy(v)}`).join(' ')}" stroke="${s.stroke}" stroke-width="2"/>${s.values.map((v,i)=>`<circle class="chart-dot" tabindex="0" role="button" aria-label="${wlabel(i,j)}" data-action="chart-point" data-series="${j}" data-index="${i}" cx="${xx(i)}" cy="${yy(v)}" r="4" fill="#fff" stroke="${s.stroke}" stroke-width="2"/>`).join('')}`).join('')}</svg>`;}
function wlabel(i,j){return `${DEMO.dashboard.weeks[i]} · ${DEMO.dashboard.series[j].name} · 错误率 ${DEMO.dashboard.series[j].values[i]}%`;}
function showSheet(title,subtitle,body,footer='',type='generic',preserveParents=false){if(!preserveParents)modalParents=[];modal=type;const o=$('#overlay');o.classList.remove('hidden');o.classList.toggle('feedback-modal',type==='feedback');o.innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><span class="sheet-handle" aria-hidden="true"></span><div class="sheet-header"><div><h2 id="sheetTitle">${title}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div><button class="icon-btn" data-action="close-modal" aria-label="${U.close}">${icon('close')}</button></div><div class="sheet-body">${body}</div>${footer?`<div class="sheet-footer">${footer}</div>`:''}</section>`;$('#content').inert=true;$('#header').inert=true;$('#nav').inert=true;$('#dock').inert=true;requestAnimationFrame(()=>o.querySelector('button')?.focus({preventScroll:true}));}
function closeSheet(all=false){aiToken++;if(all!==true&&modalParents.length){const parent=modalParents.pop();parent.restore();const body=$('#overlay .sheet-body');if(body)body.scrollTop=parent.scrollTop;requestAnimationFrame(()=>$('#overlay').querySelector(parent.focusSelector)?.focus({preventScroll:true}));return;}modalParents=[];modal=null;activeEvidence=null;feedbackStudent=null;$('#overlay').classList.remove('feedback-modal');$('#overlay').classList.add('hidden');$('#overlay').innerHTML='';['content','header','nav','dock'].forEach(id=>$('#'+id).inert=false);}

function loadingSheet(kind,done){const token=++aiToken;showSheet(kind==='lecture'?U.lectureTitle:U.taskGenerate,'',`<div class="loading"><div class="loading-mark">${icon('spark')}</div><h3>${U.loading}</h3><p>${U.loadingSub}</p><div class="loading-dots"><i></i><i></i><i></i></div></div>`,'','loading');setTimeout(()=>{if(aiToken===token)done();},1050);}
function generateLecture(){modalParents=[];openLecture();}
function openLecture(){editing=false;lectureDraft=state.lecture.map(x=>({...x}));if(state.lectureAdopted)renderLecture();else loadingSheet('lecture',()=>renderLecture());}
function renderLecture(){
 const list=lectureDraft;
 const accepted=state.lectureAdopted&&!editing;
 const footer=accepted?`<div class="btn-pair"><button class="btn adopted" disabled>${RU.adopted}</button><button class="btn primary" data-action="view-outline">${RU.viewOutline}</button></div><button class="small-link lecture-adjust-link" data-action="edit-lecture">${icon('edit')}${U.adjust}</button>`:`<div class="btn-pair"><button class="btn primary" data-action="adopt-lecture">${icon('check')}${editing?U.saveAdopt:U.adopt}</button><button class="btn secondary" data-action="edit-lecture">${editing?U.cancelEdit:U.adjust}</button></div>`;
 showSheet(U.lectureTitle,U.lectureSub,`<div class="notice" style="margin:0 0 13px">${icon(editing?'edit':accepted?'check':'spark')}<span>${editing?U.editHint:accepted?RU.adoptedAdvice:U.lectureAdvice}</span></div>${list.map((x,i)=>`<article class="lecture-item" ${editing?'draggable="true"':''} data-drag-id="${x.id}"><div class="conclusion-block"><div class="lecture-heading"><span class="rank">${i+1}</span><strong>${esc(x.title)}</strong><span class="rate-pill">${x.rate}% ${U.errorLabel}</span></div><p class="detail-line"><b>${U.cause}</b>${esc(x.cause)}</p><button class="evidence-link" data-action="view-evidence" data-id="${x.id}">${RU.evidence}</button></div><div class="detail-line"><b>${U.method}</b>${editing?`<textarea class="text-input edit-text" data-edit-lecture="${x.id}" aria-label="${esc(x.title)}${U.method}" maxlength="600">${esc(x.method)}</textarea>`:esc(x.method)}</div><div class="example"><b>${U.example}</b>${esc(x.example)}<button class="small-link" data-action="answer" data-id="${x.id}" aria-expanded="false">${U.showAnswer}${icon('down')}</button><p class="example-answer" hidden>${esc(x.answer)}</p></div>${editing?`<div class="edit-bar">${icon('grip')}<button data-action="lecture-up" data-id="${x.id}" ${i===0?'disabled':''} aria-label="${U.moveUp}${esc(x.title)}">${icon('up')}${U.moveUp}</button><button data-action="lecture-down" data-id="${x.id}" ${i===list.length-1?'disabled':''} aria-label="${U.moveDown}${esc(x.title)}">${icon('down')}${U.moveDown}</button><button class="delete-item" data-action="lecture-delete" data-id="${x.id}" ${list.length===1?'disabled':''}>${icon('trash')}${U.delete}</button></div>`:''}</article>`).join('')}`,footer+`<p class="dock-note">${U.aiDisclaimer}</p>`,'lecture',true);
}
function pushModal(renderChild,focusSelector){
 const parentType=modal,id=activeEvidence;
 modalParents.push({restore:parentType==='evidence'?()=>renderEvidence(id):()=>renderLecture(),scrollTop:$('#overlay .sheet-body')?.scrollTop||0,focusSelector});
 renderChild();
}
function openEvidence(id){pushModal(()=>renderEvidence(id),`[data-action="view-evidence"][data-id="${id}"]`);}
function renderEvidence(id){
 activeEvidence=id;
 const e=R.evidence[id],issue=DEMO.issues.find(x=>x.id===id),marks=teacherMarks[id]||{},count=Object.keys(marks).length;
 const body=`<div class="evidence-summary"><strong>${e.summary}</strong><p>${RU.evidenceSummary}：「${e.aiTag}」<span class="micro">（${RU.evidenceSource}）</span></p>${count?`<p class="marked-count">${fmt(RU.teacherCount,{count})}</p>`:''}</div><article class="card evidence-question"><h3 class="section-title">${RU.question}</h3><p class="question-ref">${e.questionNo}</p><p class="question-stem">${e.stem}</p><div class="option-list">${e.options.map(o=>`<div class="option-label">${o.key}. ${o.text}</div>`).join('')}</div><p class="answer-correct">${RU.correctAnswer}：<strong>${e.correct}</strong></p><h4 class="distribution-heading">${RU.distribution}</h4>${e.options.map(o=>`<div class="distribution-row ${o.key===e.mainWrong?'major':''}"><span class="distribution-key">${o.key}</span><span class="distribution-track"><i class="distribution-fill" style="width:${o.percent}%"></i></span><span class="distribution-percent">${o.percent}%</span>${o.key===e.mainWrong?`<span class="major-error-label">${RU.mainError}</span>`:'<span class="distribution-spacer"></span>'}</div>`).join('')}</article>${section(RU.answerList,`<span class="micro">${U.sample}</span>`)}<div class="card evidence-students">${e.students.map((p,i)=>{const mark=marks[p.id];return `<article class="evidence-student"><div class="evidence-student-head"><strong>${i+1}. ${p.name}${mark?`<span class="teacher-marked">${RU.marked}</span>`:''}</strong><button class="mark-button" data-action="mark-inaccurate" data-id="${p.id}" aria-label="${p.name}：${RU.mark}">${RU.mark}</button></div><p class="evidence-student-meta">${fmt(RU.answerChoice,{option:p.choice})} ｜ ${p.hints?fmt(RU.hintUsed,{count:p.hints}):RU.noHint} ｜ ${fmt(RU.timeUsed,{seconds:p.seconds})}</p><p class="evidence-student-tag">${RU.tag}：${esc(mark?mark.tag:p.tag)}</p></article>`;}).join('')}</div><button class="evidence-all" data-action="evidence-all">${fmt(RU.studentCount,{count:e.count})}</button><p class="evidence-dismiss">${RU.dismissHint}</p>`;
 showSheet(RU.evidenceTitle+issue.title,U.lectureSub,body,'','evidence',true);
}
function openFeedback(studentId){
 feedbackStudent=studentId;
 const e=R.evidence[activeEvidence],p=e.students.find(x=>x.id===studentId),old=teacherMarks[activeEvidence]?.[studentId];
 const reason=old?.reason||'tag',tags=e.tagOptions||R.feedback.tags;
 const body=`<fieldset class="feedback-choices"><legend class="sr-only">${RU.markTitle}</legend>${R.feedback.reasons.map(r=>`<label class="feedback-option"><input type="radio" name="feedbackReason" value="${r.id}" ${r.id===reason?'checked':''}><span>${r.label}</span></label>`).join('')}</fieldset><div class="feedback-correction" id="feedbackCorrection" ${reason!=='tag'?'hidden':''}><label class="field-label" for="feedbackTag">${RU.correctTag}</label><select class="form-select" id="feedbackTag">${tags.map(t=>`<option ${t===(old?.tag||p.tag)?'selected':''}>${t}</option>`).join('')}</select></div><label class="field-label" for="feedbackRemark">${RU.remark}<small>${RU.optional}</small></label><textarea id="feedbackRemark" class="text-input" maxlength="300" placeholder="${RU.remarkPlaceholder}">${esc(old?.note||'')}</textarea>`;
 pushModal(()=>showSheet(RU.markTitle,p.name+' · '+DEMO.issues.find(x=>x.id===activeEvidence).title,body,`<div class="btn-pair"><button class="btn primary" data-action="submit-feedback">${RU.submit}</button><button class="btn secondary" data-action="close-modal">${U.cancel}</button></div>`,'feedback',true),`[data-action="mark-inaccurate"][data-id="${studentId}"]`);
}
function submitFeedback(){
 const reason=$('input[name="feedbackReason"]:checked')?.value,option=R.feedback.reasons.find(x=>x.id===reason);
 if(!option)return toast(RU.chooseReason,'info');
 const tag=reason==='tag'?$('#feedbackTag').value:option.tag;
 if(!tag)return toast(RU.chooseTag,'info');
 (teacherMarks[activeEvidence]??={})[feedbackStudent]={reason,tag,note:$('#feedbackRemark').value.trim()};
 closeSheet();toast(RU.submitted);
}
function outlineView(){return `<div class="view with-dock outline-view"><div class="project-top"><strong>${P.brand} / ${RU.projectTitle}</strong><button class="small-link" data-action="exit-projection">${icon('close')}${RU.projectExit}</button></div><p class="page-overline">${U.lectureSub}</p><h1 class="page-title">${RU.outlineTitle}</h1><p class="page-sub">${RU.outlineSub}</p><div class="outline-intro"><span class="micro">${fmt(RU.outlineCount,{count:state.lecture.length})}</span><span class="tag dark">${RU.adopted}</span></div><div class="outline-grid">${state.lecture.map((x,i)=>`<article class="card outline-card"><div class="lecture-heading"><span class="rank">${i+1}</span><strong>${esc(x.title)}</strong><span class="rate-pill">${x.rate}%</span></div><p class="detail-line"><b>${RU.outlineMethod}</b>${esc(x.method)}</p><div class="example"><b>${RU.outlineExample}</b>${esc(x.example)}<button class="small-link" data-action="answer" data-id="${x.id}" aria-expanded="false">${U.showAnswer}${icon('down')}</button><p class="example-answer" hidden>${esc(x.answer)}</p></div></article>`).join('')}</div>${projecting?`<p class="tip-line">${icon('info')}${RU.projectHint}</p>`:`<div class="notice">${icon('check')}<span>${U.aiDisclaimer}</span></div>`}</div>`;}
function feedbackLibraryCard(){const count=Object.values(teacherMarks).reduce((n,marks)=>n+Object.keys(marks).length,0);return `<section class="card library-card"><div class="row between"><h2 class="section-title">${RU.libraryTitle}</h2><span class="micro">${RU.librarySample}</span></div><p class="library-row">${RU.weeklyMarks}：<b>${R.library.weeklyCount} ${RU.times}</b></p><p class="library-row">${RU.mostCorrected}<br><b>「${R.library.from}」→「${R.library.to}」</b>（${R.library.correctedCount} ${RU.times}）</p><span class="library-status">${RU.libraryStatus}</span><p class="library-explanation">${RU.libraryExplanation}</p>${count?`<p class="tip-line">${icon('edit')}${fmt(RU.sessionMarks,{count})}</p>`:''}</section>`;}
function setProjection(active){projecting=active;document.body.classList.toggle('projecting',active);render();$('#content').scrollTop=0;if(active)toast(RU.projectToast,'info');}

function openStudent(id){detailId=id;adviceReady=false;adviceEdit=false;clearTimeout(adviceTimer);render();$('#content').scrollTop=0;adviceTimer=setTimeout(()=>{if(detailId===id){adviceReady=true;const pos=$('#content').scrollTop;render();$('#content').scrollTop=pos;}},1050);}
function showIssue(id){const x=DEMO.issues.find(x=>x.id===id);showSheet(x.title,`${U.errorLabel} ${x.rate}% · ${P.className}`,`<p class="detail-line"><b>${U.cause}</b>${x.cause}</p><div class="example"><b>${U.weekIssue}</b>${x.example}</div><p class="readonly-label">${icon('info')}${U.issueHint}</p>`,`<button class="btn primary" data-action="generate-lecture">${icon('spark')}${U.generate}</button>`,'issue');}
function taskGenerate(reset=false){loadingSheet('tasks',()=>{if(reset===true){const f=fresh();state.groups=f.groups;state.members=f.members;}state.tasksReady=true;state.assigned=false;save();closeSheet();render();toast(U.taskReady);});}
function showMove(id,group){const candidate=group?people.filter(p=>state.members[p.id-1]===group):people;const selected=id||candidate[0]?.id;if(!selected){toast(U.searchEmpty,'info');return;}const current=state.members[selected-1];showSheet(U.taskMove,U.taskNotice,`<label class="field-label" for="movePerson">${U.taskRoster}</label><select id="movePerson" class="form-select">${candidate.map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${p.name} · ${state.groups.find(g=>g.id===state.members[p.id-1]).name}</option>`).join('')}</select><label class="field-label" for="moveTarget">${U.taskTarget}</label><select id="moveTarget" class="form-select">${state.groups.map(g=>`<option value="${g.id}" ${g.id===current?'disabled':''}>${g.name}</option>`).join('')}</select><p class="tip-line">${icon('info')}${U.taskMoveHint}</p>`,`<div class="btn-pair"><button class="btn primary" data-action="confirm-move">${U.taskMoveConfirm}</button><button class="btn secondary" data-action="close-modal">${U.cancel}</button></div>`,'move');}
function taskSuccess(){if(state.groups.some(g=>!g.questions.length)){toast(U.taskEmpty,'info');return;}state.assigned=true;save();render();toast(U.taskPosted);showSheet(U.taskPosted,U.taskSubject,`<div class="success-symbol">${icon('check')}</div><h3 class="success-title">${U.taskSent}</h3><p class="success-copy">${U.taskSuccessText}</p><div class="divider"></div>${state.groups.map(g=>`<div class="summary-row"><span>${g.name}</span><span>${state.members.filter(x=>x===g.id).length} 人 · ${g.questions.length} 道题</span></div>`).join('')}<div class="notice">${icon('info')}<span>${U.taskSuccessLocal}</span></div>`,`<button class="btn primary" data-action="close-modal">${U.taskReturn}</button>`,'task-success');}
function info(){showSheet(U.infoTitle,U.infoSub,`<div class="info-copy">${U.infoItems.map((x,i)=>`<div class="help-list"><span>${i+1}</span><div><h3>${x[0]}</h3><p>${x[1]}</p></div></div>`).join('')}<div class="divider"></div><p>${U.infoFoot}</p><p>${DEMO.info.context}</p></div>`,`<div class="btn-pair"><button class="btn primary" data-action="close-modal">${U.okay}</button><button class="btn secondary" data-action="reset">${icon('reset')}${U.reset}</button></div>`,'info');}
function confirmSheet(title,text,action,label){showSheet(title,'',`<p class="detail-line" style="margin:0">${text}</p>`,`<div class="btn-pair"><button class="btn primary" data-action="${action}">${label}</button><button class="btn secondary" data-action="close-modal">${U.cancel}</button></div>`,'confirm');}
function persistAdvice(){if(adviceEdit){const value=$('#adviceInput')?.value.trim();if(!value){toast(U.noteUnsaved,'info');return false;}state.advice[detailId]=value;adviceEdit=false;save();}return true;}
function recordStudent(status){if(status==='adopted'&&!persistAdvice())return;state.status[detailId]=status;const p=people.find(x=>x.id===detailId);state.records[detailId]=status==='adopted'?`${U.adopted}：${state.advice[detailId]||p.advice}${state.notes[detailId]?'；老师备注：'+state.notes[detailId]:''}`:`${U.deferredMessage}${state.notes[detailId]?'；老师备注：'+state.notes[detailId]:''}`;save();render();toast(status==='adopted'?U.adoptedMessage:U.deferredMessage,status==='adopted'?'check':'clock');}
function route(next){if(projecting){projecting=false;document.body.classList.remove('projecting');}closeSheet(true);clearTimeout(adviceTimer);detailId=null;tab=next;render();$('#content').scrollTop=0;}
const actions={
 'view-evidence':b=>openEvidence(b.dataset.id),'evidence-all':()=>toast(RU.sampleOnly,'info'),'mark-inaccurate':b=>openFeedback(b.dataset.id),'submit-feedback':submitFeedback,
 'view-outline':()=>route('outline'),'outline-home':()=>route('home'),'outline-back':()=>{route('home');generateLecture();},'project-outline':()=>setProjection(true),'exit-projection':()=>setProjection(false),
 'tab':b=>route(b.dataset.tab),'week':()=>toast(U.limited,'info'),'info':info,'close-modal':closeSheet,'student':b=>openStudent(Number(b.dataset.id)),'back':()=>{clearTimeout(adviceTimer);detailId=null;render();$('#content').scrollTop=0;},'issue':b=>showIssue(b.dataset.id),'generate-lecture':generateLecture,
 'edit-lecture':()=>{editing=!editing;if(!editing)lectureDraft=state.lecture.map(x=>({...x}));renderLecture();},
 'lecture-up':b=>moveLecture(b.dataset.id,-1),'lecture-down':b=>moveLecture(b.dataset.id,1),
 'lecture-delete':b=>{if(lectureDraft.length<=1)return toast(U.noLecture,'info');lectureDraft=lectureDraft.filter(x=>x.id!==b.dataset.id);renderLecture();toast(U.reviewRemoved);},
 'adopt-lecture':()=>{if(state.lectureAdopted&&!editing)return;if(lectureDraft.some(x=>!x.method.trim()))return toast(U.lectureEmptyMethod,'info');state.lecture=lectureDraft.map(x=>({...x}));state.lectureAdopted=true;editing=false;save();render();renderLecture();toast(RU.adoptSuccess);},
 'answer':b=>{const a=b.nextElementSibling;a.hidden=!a.hidden;b.setAttribute('aria-expanded',String(!a.hidden));b.innerHTML=(a.hidden?U.showAnswer:U.hideAnswer)+icon(a.hidden?'down':'up');},
 'edit-advice':()=>{if(adviceEdit){if(!persistAdvice())return;toast(U.reviewSaved);}else adviceEdit=true;const pos=$('#content').scrollTop;render();$('#content').scrollTop=pos;if(adviceEdit)$('#adviceInput').focus({preventScroll:true});},
 'adopt-student':()=>recordStudent('adopted'),'defer-student':()=>recordStudent('deferred'),
 'roster-filter':b=>{rosterFilter=Number(b.dataset.index);render();},
 'generate-tasks':taskGenerate,'confirm-tasks':taskSuccess,'move-student':b=>showMove(Number(b.dataset.id)),'move-group':b=>showMove(null,b.dataset.group),
 'confirm-move':()=>{const id=Number($('#movePerson').value),target=$('#moveTarget').value;if(state.members[id-1]===target)return toast(U.taskMoveSame,'info');state.members[id-1]=target;state.assigned=false;save();closeSheet();render();toast(U.taskMoveSuccess);},
 'delete-question':b=>{const g=state.groups.find(x=>x.id===b.dataset.group);g.questions=g.questions.filter(q=>q.id!==b.dataset.id);state.assigned=false;save();const pos=$('#content').scrollTop;render();$('#content').scrollTop=pos;toast(U.taskDeleteSuccess);},
 'restore-questions':b=>{const g=state.groups.find(x=>x.id===b.dataset.group);g.questions=DEMO.groups.find(x=>x.id===g.id).questions.map(q=>({...q}));state.assigned=false;save();const pos=$('#content').scrollTop;render();$('#content').scrollTop=pos;toast(U.taskRestoreMessage);},
 'regenerate-tasks':()=>confirmSheet(U.taskRegenTitle,U.taskRegenText,'do-regenerate',U.taskRegenConfirm),
 'do-regenerate':()=>taskGenerate(true),
 'chart-point':b=>{$('#chartTooltip').textContent=wlabel(Number(b.dataset.index),Number(b.dataset.series));},
 'reset':()=>confirmSheet(U.resetTitle,U.resetText,'do-reset',U.resetConfirm),
 'do-reset':()=>{teacherMarks={};state=fresh();save();rosterFilter=0;search='';route('home');toast(U.resetSuccess);}
};
function moveLecture(id,delta){const i=lectureDraft.findIndex(x=>x.id===id),j=i+delta;if(j<0||j>=lectureDraft.length)return;[lectureDraft[i],lectureDraft[j]]=[lectureDraft[j],lectureDraft[i]];renderLecture();}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&!b.disabled&&actions[b.dataset.action])actions[b.dataset.action](b);else if(e.target===$('#overlay')&&modal!=='loading')closeSheet();});
document.addEventListener('input',e=>{if(e.target.id==='teacherNote'){state.notes[detailId]=e.target.value;save();}if(e.target.id==='studentSearch'){search=e.target.value;$('#studentRows').innerHTML=studentRows(filteredPeople());}if(e.target.dataset.editLecture){const item=lectureDraft.find(x=>x.id===e.target.dataset.editLecture);if(item)item.method=e.target.value;}});
document.addEventListener('change',e=>{if(e.target.name==='feedbackReason'){$('#feedbackCorrection').hidden=e.target.value!=='tag';}if(e.target.id==='classSelect'||e.target.id==='subjectSelect'){if($('#classSelect').value!==P.className||$('#subjectSelect').value!==P.subject){toast(U.limited,'info');$('#classSelect').value=P.className;$('#subjectSelect').value=P.subject;}}if(e.target.id==='movePerson'){const current=state.members[Number(e.target.value)-1];$('#moveTarget').innerHTML=state.groups.map(g=>`<option value="${g.id}" ${g.id===current?'disabled':''}>${g.name}</option>`).join('');}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeSheet();else if(e.key==='Escape'&&projecting)setProjection(false);if((e.key==='Enter'||e.key===' ')&&e.target.matches('.chart-dot')){e.preventDefault();actions['chart-point'](e.target);}if(e.key==='Tab'&&modal){const nodes=[...$('#overlay').querySelectorAll('button:not(:disabled),select,textarea,input,[tabindex="0"]')];if(!nodes.length)return;const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
document.addEventListener('dragstart',e=>{const c=e.target.closest('[draggable=true]');if(!c)return;dragId=c.dataset.dragId;e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move';c.classList.add('dragging');});
document.addEventListener('dragover',e=>{const c=e.target.closest('[draggable=true]');if(c){e.preventDefault();e.dataTransfer.dropEffect='move';c.classList.add('drag-over');}});
document.addEventListener('dragleave',e=>{e.target.closest('[draggable=true]')?.classList.remove('drag-over');});
document.addEventListener('drop',e=>{const c=e.target.closest('[draggable=true]');if(!c)return;e.preventDefault();const a=lectureDraft.findIndex(x=>x.id===dragId),b=lectureDraft.findIndex(x=>x.id===c.dataset.dragId);if(a>=0&&b>=0&&a!==b){const [item]=lectureDraft.splice(a,1);lectureDraft.splice(b,0,item);renderLecture();}});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.dragging,.drag-over').forEach(n=>n.classList.remove('dragging','drag-over'));});
document.addEventListener('pointerdown',e=>{if(!modal||!e.target.closest('.sheet-header,.sheet-handle')||e.target.closest('button,input,textarea,select,label'))return;sheetSwipe={id:e.pointerId,x:e.clientX,y:e.clientY};});
document.addEventListener('pointerup',e=>{if(!sheetSwipe||sheetSwipe.id!==e.pointerId)return;const swipe=sheetSwipe;sheetSwipe=null;if(e.clientY-swipe.y>65&&Math.abs(e.clientX-swipe.x)<80)closeSheet();});
document.addEventListener('pointercancel',()=>{sheetSwipe=null;});
$('#intro').innerHTML=`<div class="brand">${I.logo}${P.brand}</div><p class="eyebrow">${DEMO.presentation.eyebrow}</p><h1>${DEMO.presentation.title.join('<br>')}</h1><p class="sub">${DEMO.presentation.sub.join('<br>')}</p><div class="intro-line"></div><p class="intro-foot">${DEMO.presentation.footer.join('<br>')}</p>`;
$('#desktopNote').innerHTML=DEMO.presentation.steps.map((x,i)=>`<div class="step"><b>0${i+1}</b><div><strong>${x[0]}</strong><p>${x[1]}</p></div></div>`).join('')+`<div class="demo-tools"><button class="text-button" data-action="info">${icon('info')}${U.info}${icon('chevron')}</button><button class="text-button" data-action="reset">${icon('reset')}${U.reset}</button></div>`;
render();
if(storageWarning)setTimeout(()=>toast(U.storageUnavailable,'info'),500);
</script>
</body>
</html>
